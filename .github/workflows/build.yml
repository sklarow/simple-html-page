name: Build and Upload Artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Upload index.html as artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-page
          path: index.html
          retention-days: 30
  trigger-automation:
      runs-on: ubuntu-latest
      needs: build # Wait for the build job to complete successfully
      steps:
        - name: Trigger automation workflow
          run: |
            # Use the GitHub CLI (gh) to dispatch a repository_dispatch event
            gh api \
              --method POST \
              -H "Accept: application/vnd.github.v3+json" \
              /repos/sklarow/test-simple-html-page/dispatches \
              -f event_type='trigger-e2e-tests' \
              --raw-field client_payload="{\"run_id\": \"${{ github.run_id }}\", \"repo\": \"${{ github.repository }}\"}"
          env:
            # This token needs 'repo' scope and must be a Personal Access Token (PAT)
            # GITHUB_TOKEN won't work across repositories for repository_dispatch.
            GH_TOKEN: ${{ secrets.PAT_FOR_TRIGGER }}
