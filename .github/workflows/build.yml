name: Build and Upload Artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Upload index.html as artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-page
          path: index.html
          retention-days: 30

